{% extends "admin_base.html" %}{% block title %}{{ 'Edit' if product else 'Add' }} Product — COMSAY{% endblock %}{% block admin_content %}<div class="admin-heading"><div><span class="eyebrow">CATALOG MANAGEMENT</span><h1>{{ 'Edit product' if product else 'New product' }}<span class="gradient-text">.</span></h1></div></div><form class="auth-card stack-form product-edit-form" method="post" enctype="multipart/form-data"><label>Product name<input name="name" required value="{{ product.name if product else '' }}"></label><label>Category<input name="category" value="{{ product.category if product else '3D Model' }}"></label><label>Price (PHP)<input name="price" type="number" min="0" step="0.01" required value="{{ product.price if product else '' }}"></label><label>Description<textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label><label>3D model file (.glb / .gltf)<input type="file" name="model" accept=".glb,.gltf"></label><label>Or model URL<input name="model_url" value="{{ product.model_url if product else '' }}" placeholder="https://.../model.glb"></label><label>Product image (PNG/JPG/WEBP)<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"></label><label class="check-label"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Feature on homepage</label><div class="form-actions"><button class="btn btn-primary">Save product</button><a class="btn btn-ghost" href="{{ url_for('admin_products') }}">Cancel</a></div></form>{% endblock %}
