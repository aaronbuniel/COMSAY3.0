{% extends "base.html" %}{% block title %}Account — COMSAY{% endblock %}{% block content %}<section class="container section"><div class="page-heading"><span class="eyebrow">YOUR SPACE</span><h1>Account <span class="gradient-text">settings.</span></h1><p>Manage your profile and security.</p></div><div class="account-grid"><form class="auth-card stack-form" action="{{ url_for('update_account') }}" method="post"><h2>Profile details</h2><label>Name<input name="name" value="{{ user.name }}" required></label><label>Email<input type="email" name="email" value="{{ user.email }}" required></label><button class="btn btn-primary">Save changes</button><a class="text-link" href="{{ url_for('my_orders') }}">View my orders →</a></form><form class="auth-card stack-form" action="{{ url_for('change_password') }}" method="post"><h2>Change password</h2><label>Current password<input type="password" name="old_password" required></label><label>New password<input type="password" name="new_password" minlength="8" required></label><button class="btn btn-ghost">Update password</button></form></div></section>{% endblock %}
